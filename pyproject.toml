[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tos-toolkit"
version = "0.1.0"
description = "Static analysis, scaffolding, and review tooling for ThinkScript (thinkorswim) code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jorge Barnaby" }]
keywords = ["thinkscript", "thinkorswim", "trading", "static-analysis"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
# The real-parser grammar check needs a local thinkorswim install and a JDK.
# No Python dependencies are added; the extra exists so the requirement is
# explicit and installable as `tos-toolkit[parser]`.
parser = []
dev = ["pytest>=8"]

[project.scripts]
tos = "tos_toolkit.cli:main"

[project.urls]
Documentation = "https://github.com/brnby/tos-toolkit"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tos_toolkit = [
    "data/*.json",
    "data/profiles/*.toml",
    "prompts/*.md",
    "parser/java/*.java",
    "scaffold/project/*",
    "scaffold/templates/*",
    "docs/**/*.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
