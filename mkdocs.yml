site_name: tos-toolkit
site_description: Static analysis, scaffolding, and adversarial review for ThinkScript
site_url: https://yorch.github.io/tos-toolkit/
repo_url: https://github.com/yorch/tos-toolkit
repo_name: yorch/tos-toolkit
edit_uri: edit/main/docs/
copyright: MIT licensed. Unofficial — not affiliated with Charles Schwab.

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - content.code.copy
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

nav:
  - Home: index.md
  - Commands: commands.md
  - Configuration: configuration.md
  - Rules: rules.md
  - Adopting it: consuming.md
  - Architecture: architecture.md
  - ThinkScript reference:
      - Overview: knowledge-base/README.md
      - Language: knowledge-base/language-reference.md
      - Functions: knowledge-base/functions.md
      - Constants: knowledge-base/constants.md
      - Gotchas: knowledge-base/gotchas.md
      - Asset classes: knowledge-base/asset-classes.md
      - Artifact rules: knowledge-base/artifact-rules.md
      - Unverified tokens: knowledge-base/unverified-tokens.md
  - Decisions:
      - Overview: adr/README.md
      - 0001 pip package: adr/0001-pip-package-with-cli.md
      - 0002 Layered rules: adr/0002-layered-core-and-profiles.md
      - 0003 Optional grammar check: adr/0003-grammar-check-is-optional.md
      - 0004 No jar redistribution: adr/0004-no-jar-redistribution.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yorch/tos-toolkit
