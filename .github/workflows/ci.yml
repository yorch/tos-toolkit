name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (py${{ matrix.python }} · ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Byte-compile
        run: python -m compileall -q src/tos_toolkit

  package:
    name: build and check distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install build tooling
        run: python -m pip install build twine
      - name: Build sdist and wheel
        run: python -m build
      - name: Check metadata
        run: python -m twine check dist/*
      - name: Assert no third-party code is bundled
        run: |
          set -eu
          # The parser bridge must ship our own shim only.
          if unzip -l dist/*.whl | grep -Ei 'thinkscript-|toscommon|dxlib' | grep -v 'Checker'; then
            echo "::error::a thinkorswim jar appears to be bundled in the wheel"
            exit 1
          fi
          echo "no vendored thinkorswim artefacts found"
      - name: Install the wheel and smoke-test the CLI
        run: |
          set -eu
          python -m pip install dist/*.whl
          tos --version
          work="$(mktemp -d)"
          cd "$work"
          tos init --profile loose >/dev/null
          tos new study trend/smoke >/dev/null
          tos lint
          tos status
          tos docs --list >/dev/null
          tos explain TrueRange >/dev/null
          echo "smoke test passed"
      - name: Assert lint rejects a known collision
        run: |
          set -eu
          work="$(mktemp -d)"
          cd "$work"
          tos init --profile loose >/dev/null
          # Case-insensitive identifier collision: the failure this tool exists for.
          printf 'declare upper;\nrec pdHigh = 1;\nplot PdHigh = pdHigh;\n' \
            > studies/trend/broken.thinkscript
          # Global flags precede the subcommand.
          set +e
          output="$(tos --profile loose lint 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 1 ]; then
            echo "::error::expected exit 1 (lint findings), got $status"
            exit 1
          fi
          if ! printf '%s' "$output" | grep -q 'E071'; then
            echo "::error::expected diagnostic E071 in the output"
            exit 1
          fi
          echo "lint correctly rejected the collision with E071"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  selfcheck:
    name: tos is clean against its own templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Lint the bundled templates
        run: tos --profile loose lint src/tos_toolkit/scaffold/templates

  docs:
    name: docs build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install docs tooling
        run: python -m pip install -r docs/requirements.txt
      - name: Stage the knowledge base
        run: python scripts/sync_kb_docs.py
      - name: Build site (strict)
        run: mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: site/
