name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7  # pin to a SHA before relying on release integrity
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install build twine

      - name: Verify the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -eu
          tag="${GITHUB_REF_NAME#v}"
          # tomllib, not `import tos_toolkit`: the package is not installed yet
          # at this point in the job (src/ layout).
          version="$(python - <<'PY'
          import pathlib, tomllib
          print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])
          PY
          )"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match __version__ $version"
            exit 1
          fi
          echo "tag and version agree: $version"

      - name: Build
        run: python -m build

      - name: Check metadata
        run: python -m twine check dist/*

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag

      # PyPI publishing is intentionally not automated. To enable it:
      #   1. add a PYPI_API_TOKEN repository secret
      #   2. uncomment the step below
      # Publishing is a deliberate human act for a package whose rules are
      # still churning.
      #
      # - name: Publish to PyPI
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     password: ${{ secrets.PYPI_API_TOKEN }}
